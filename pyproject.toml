[project]
name = "customer-health-intelligence"
version = "0.1.0"
description = "Multi-tenant customer health scoring with auditable, dry-run-first outreach"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "streamlit>=1.66.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires the PostgreSQL service from docker-compose",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "pandas.*"]
ignore_missing_imports = true
